name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run
        env:
          JWT_SECRET: test-secret-key-for-jwt-signing-minimum-32-chars
          NODE_ENV: test

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: test-secret-key-for-jwt-signing-minimum-32-chars
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        run: npm run build
        env:
          # Variáveis mínimas para build passar
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test"
          JWT_SECRET: "build-secret-key-for-jwt-signing-minimum-32-chars"
          NEXT_PUBLIC_BASE_URL: "https://profdanielbarral.com"

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: test
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barral_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d barral_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare local smoke database
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/barral_e2e"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public smoke tests
        run: npm run test:e2e:smoke
        env:
          TEST_DATABASE_URL: ""
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/barral_e2e"

      - name: Require isolated database on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TEST_DATABASE_URL == ''
        run: |
          echo "TEST_DATABASE_URL deve estar configurada no branch principal."
          exit 1

      - name: Run isolated database scenarios
        if: env.TEST_DATABASE_URL != ''
        run: >-
          npm run test:e2e --
          e2e/admin-authorization.spec.ts
          e2e/course-expiration.spec.ts
          e2e/document-download.spec.ts

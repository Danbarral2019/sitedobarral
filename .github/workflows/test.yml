name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run
        env:
          JWT_SECRET: test-secret-key-for-jwt-signing-minimum-32-chars
          NODE_ENV: test

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: test-secret-key-for-jwt-signing-minimum-32-chars
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        run: npm run build
        env:
          # Variáveis mínimas para build passar
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test"
          JWT_SECRET: "build-secret-key-for-jwt-signing-minimum-32-chars"
          NEXT_PUBLIC_BASE_URL: "https://profdanielbarral.com"

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A aplicação fala com o banco pelo driver serverless da Neon, que usa
      # WebSocket — protocolo que um PostgreSQL comum não atende. Por isso o
      # banco de teste é uma branch descartável da própria Neon, e não um
      # container local: assim o teste exercita o mesmo caminho da produção,
      # sem exigir proxy nem driver alternativo no código do site.
      - name: Calcular expiração da branch de teste
        id: prazo
        run: echo "em=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `schema-only` copia a estrutura sem copiar os dados: nenhum dado de
      # usuário real entra no CI. `expires_at` é a rede de proteção contra
      # branch órfã, que já custou caro a este projeto (ver o workflow
      # cleanup-neon-preview-branch.yml).
      - name: Criar banco descartável na Neon
        id: banco
        uses: neondatabase/create-branch-action@v6.3.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-e2e/${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: schema-only
          expires_at: ${{ steps.prazo.outputs.em }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Exigir banco isolado
        if: steps.banco.outputs.db_url == ''
        run: |
          echo "A branch de teste na Neon não foi criada; sem banco isolado não se roda E2E."
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      # A branch nasce com o schema da produção. Este passo a converge para o
      # schema deste commit, que é o que o código sob teste espera.
      - name: Convergir o schema ao do commit
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          npx prisma db push --accept-data-loss
        env:
          TEST_DATABASE_URL: ${{ steps.banco.outputs.db_url }}
          DATABASE_URL: ${{ steps.banco.outputs.db_url }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public smoke tests
        run: npm run test:e2e:smoke
        env:
          TEST_DATABASE_URL: ${{ steps.banco.outputs.db_url }}

      - name: Run isolated database scenarios
        run: >-
          npm run test:e2e --
          e2e/admin-authorization.spec.ts
          e2e/course-expiration.spec.ts
          e2e/document-download.spec.ts
          e2e/heranca-editorial.spec.ts
        env:
          TEST_DATABASE_URL: ${{ steps.banco.outputs.db_url }}
          # heranca-editorial.spec.ts chama `persistirDestilacao` diretamente
          # (não via HTTP), e essa função passa por `lib/prisma`, que lê
          # DATABASE_URL — não TEST_DATABASE_URL. É o mesmo banco descartável
          # que o passo já usa acima.
          DATABASE_URL: ${{ steps.banco.outputs.db_url }}

      # Sempre, inclusive quando os testes falham: branch retida acumula
      # custo de armazenamento mesmo com o compute ocioso.
      - name: Apagar o banco descartável
        if: always()
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-e2e/${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

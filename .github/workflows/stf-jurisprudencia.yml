name: STF — coleta de jurisprudência

on:
  # ⚠️ ESTE WORKFLOW NÃO FUNCIONA. Mantido como registro do que foi medido.
  #
  # A hipótese era que o Chromium do GitHub Actions venceria o AWS WAF de
  # jurisprudencia.stf.jus.br. Foi testada em 17/08/2026 e REFUTADA: o job
  # rodou duas vezes e as duas receberam HTTP 403.
  #
  # A investigação seguinte, na máquina do Daniel, isolou a causa — não é IP
  # de datacenter, nem o desafio JavaScript em si:
  #
  #   requisição server-side (curl/fetch)  → 202 + x-amzn-waf-action: challenge
  #   Chromium HEADLESS                    → 403
  #   Chromium HEADED (janela visível)     → 200 ✅
  #
  # É DETECÇÃO DE HEADLESS. Como runner do GitHub não tem display, o Chromium
  # sai headless e é barrado.
  #
  # A coleta passou a ser MENSAL E MANUAL, na máquina do Daniel:
  #     npm run stf:coletar
  #
  # Caminho não testado, caso um dia se queira automação completa: rodar o
  # Chromium em modo headed sob display virtual, com
  # `xvfb-run npx tsx scripts/stf-runner.ts` e `headless: false`. Isso PODE
  # contornar a detecção — ninguém verificou. Se for tentar, tratar como
  # hipótese, não como solução.
  #
  # schedule:
  #   - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Coletar no STF e enviar para ingestão
        run: npx tsx scripts/stf-runner.ts
        env:
          STF_INGEST_URL: ${{ secrets.STF_INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
